<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snip — URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <div class="logo">snip<span class="logo-dot">.</span></div>
      <div class="nav-links">
        <button class="nav-btn active" data-tab="shorten">Shorten</button>
        <button class="nav-btn" data-tab="dashboard">Dashboard</button>
      </div>
    </div>
  </nav>

  <!-- Shorten Tab -->
  <main id="tab-shorten" class="tab active">
    <section class="hero">
      <p class="hero-eyebrow">// link shortener</p>
      <h1 class="hero-title">Cut the clutter.<br><span class="accent">Keep the link.</span></h1>
      <p class="hero-sub">Paste any URL, get a short link with real-time click analytics.</p>
    </section>

    <section class="card form-card">
      <div class="form-group">
        <label class="form-label" for="urlInput">Long URL</label>
        <input id="urlInput" class="input" type="url" placeholder="https://example.com/very/long/url/that/you/want/to/shorten" />
      </div>
      <div class="form-group">
        <label class="form-label" for="aliasInput">Custom alias <span class="optional">(optional)</span></label>
        <div class="alias-row">
          <span class="alias-prefix" id="aliasPrefix">localhost:3000/</span>
          <input id="aliasInput" class="input alias-input" type="text" placeholder="my-link" maxlength="20" />
        </div>
        <p class="hint">3–20 characters: letters, numbers, hyphens, underscores</p>
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button class="btn-primary" id="shortenBtn">Shorten URL →</button>
    </section>

    <section id="resultSection" class="card result-card hidden">
      <div class="result-label">Your short link is ready</div>
      <div class="result-url-row">
        <a class="result-url" id="resultUrl" href="#" target="_blank"></a>
        <button class="btn-copy" id="copyBtn">Copy</button>
      </div>
      <div class="result-orig" id="resultOrig"></div>
      <div class="result-actions">
        <button class="btn-ghost" onclick="resetForm()">Shorten another</button>
        <button class="btn-ghost" onclick="switchTab('dashboard')">View all links →</button>
      </div>
    </section>
  </main>

  <!-- Dashboard Tab -->
  <main id="tab-dashboard" class="tab">
    <div class="dash-header">
      <h2 class="dash-title">Your links</h2>
      <button class="btn-refresh" onclick="loadDashboard()">↻ Refresh</button>
    </div>

    <div class="stats-row" id="globalStats">
      <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">Total links</div></div>
      <div class="stat-card"><div class="stat-num" id="statClicks">0</div><div class="stat-lbl">Total clicks</div></div>
      <div class="stat-card"><div class="stat-num" id="statAvg">0</div><div class="stat-lbl">Avg clicks</div></div>
    </div>

    <div id="linksList" class="links-list">
      <div class="empty-state">No links yet. <button class="link-btn" onclick="switchTab('shorten')">Create your first →</button></div>
    </div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
